<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Outer Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Main Gradient: Cyber Electric Indigo to Cyan -->
    <linearGradient id="conduit-stream" x1="6" y1="24" x2="42" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="45%" stop-color="#8B5CF6" />
      <stop offset="80%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Upper Branch Stream Gradient -->
    <linearGradient id="upper-stream" x1="10" y1="24" x2="38" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="60%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Lower Branch Stream Gradient -->
    <linearGradient id="lower-stream" x1="10" y1="24" x2="38" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Metallic Node Shield Shadow -->
    <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark Slate/Black squircle badge with subtle neon border -->
  <rect x="1" y="1" width="46" height="46" rx="13" fill="#090D16" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2"/>
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#glow)"/>

  <!-- Pipeline Conduits (Smooth Cubic Bézier curves representing convergence and orchestration) -->
  <!-- Upper conduit pipe -->
  <path d="M 12 24 C 18 24, 20 12, 34 12" stroke="url(#upper-stream)" stroke-width="2.75" stroke-linecap="round"/>
  <!-- Central pipeline spine -->
  <path d="M 12 24 C 20 24, 26 24, 38 24" stroke="url(#conduit-stream)" stroke-width="2.75" stroke-linecap="round"/>
  <!-- Lower conduit pipe -->
  <path d="M 12 24 C 18 24, 20 36, 34 36" stroke="url(#lower-stream)" stroke-width="2.75" stroke-linecap="round"/>

  <!-- Left Origin Nexus Node -->
  <circle cx="12" cy="24" r="5" fill="#090D16" stroke="#6366F1" stroke-width="2.5" filter="url(#node-shadow)"/>
  <circle cx="12" cy="24" r="2.2" fill="#818CF8"/>

  <!-- Top Destination Node -->
  <circle cx="34" cy="12" r="4.2" fill="#090D16" stroke="#EC4899" stroke-width="2" filter="url(#node-shadow)"/>
  <circle cx="34" cy="12" r="1.8" fill="#F472B6"/>

  <!-- Center Destination Node -->
  <circle cx="38" cy="24" r="4.5" fill="#090D16" stroke="#06B6D4" stroke-width="2.2" filter="url(#node-shadow)"/>
  <circle cx="38" cy="24" r="2" fill="#22D3EE"/>

  <!-- Bottom Destination Node -->
  <circle cx="34" cy="36" r="4.2" fill="#090D16" stroke="#10B981" stroke-width="2" filter="url(#node-shadow)"/>
  <circle cx="34" cy="36" r="1.8" fill="#34D399"/>
</svg>