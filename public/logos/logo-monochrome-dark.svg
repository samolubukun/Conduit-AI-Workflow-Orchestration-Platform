<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimalist White Squircle Badge -->
  <rect x="1" y="1" width="46" height="46" rx="13" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>

  <!-- Jet Black Monochrome Pipelines -->
  <path d="M 12 24 C 18 24, 20 12, 34 12" stroke="#000000" stroke-width="2.75" stroke-linecap="round"/>
  <path d="M 12 24 C 20 24, 26 24, 38 24" stroke="#000000" stroke-width="2.75" stroke-linecap="round"/>
  <path d="M 12 24 C 18 24, 20 36, 34 36" stroke="#000000" stroke-width="2.75" stroke-linecap="round"/>

  <!-- Left Origin Node -->
  <circle cx="12" cy="24" r="5" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <circle cx="12" cy="24" r="2.2" fill="#000000"/>

  <!-- Top Destination Node -->
  <circle cx="34" cy="12" r="4.2" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <circle cx="34" cy="12" r="1.8" fill="#000000"/>

  <!-- Center Destination Node -->
  <circle cx="38" cy="24" r="4.5" fill="#FFFFFF" stroke="#000000" stroke-width="2.2"/>
  <circle cx="38" cy="24" r="2" fill="#000000"/>

  <!-- Bottom Destination Node -->
  <circle cx="34" cy="36" r="4.2" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <circle cx="34" cy="36" r="1.8" fill="#000000"/>
</svg>
