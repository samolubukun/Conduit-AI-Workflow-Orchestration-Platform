<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimalist Transparent Glyph (inherits currentColor or pure white for inlining) -->
  <!-- Fluid Pipeline Conduits -->
  <path d="M 10 24 C 16 24, 18 12, 34 12" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"/>
  <path d="M 10 24 C 18 24, 24 24, 38 24" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"/>
  <path d="M 10 24 C 16 24, 18 36, 34 36" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"/>

  <!-- Left Origin Node -->
  <circle cx="10" cy="24" r="4.5" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <circle cx="10" cy="24" r="2" fill="currentColor"/>

  <!-- Top Destination Node -->
  <circle cx="34" cy="12" r="3.8" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="34" cy="12" r="1.6" fill="currentColor"/>

  <!-- Center Destination Node -->
  <circle cx="38" cy="24" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="38" cy="24" r="1.8" fill="currentColor"/>

  <!-- Bottom Destination Node -->
  <circle cx="34" cy="36" r="3.8" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="34" cy="36" r="1.6" fill="currentColor"/>
</svg>
